name: Pingless Auto Renew + AFK Credits

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt
          playwright install chromium --with-deps

      - name: Run Renew + AFK
        env:
          # 推荐使用 STORAGE_STATE_JSON（base64 或原始 JSON）
          STORAGE_STATE_JSON: ${{ secrets.STORAGE_STATE_JSON }}
          SESSION_COOKIE: ${{ secrets.SESSION_COOKIE }}
          SERVER_ID: ${{ secrets.SERVER_ID }}
          NUMERIC_ID: ${{ secrets.NUMERIC_ID }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          AFK_SECONDS: "1800"
        run: python scripts/renew.py

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_id }}
          path: screenshots/
          retention-days: 5
